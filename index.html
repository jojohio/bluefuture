<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projekt Blue Future</title>
<style>
  :root{--ink:#14302a;--accent:#1f6f4a;--paper:#f6f8f5}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink)}
  .hero{position:relative;height:72vh;min-height:420px;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center}
  .hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,30,25,.15) 0%,rgba(10,30,25,.45) 100%);z-index:1}
  .hero-text{position:relative;z-index:2;color:#fff;padding:0 16px;max-width:1000px;text-shadow:0 2px 12px rgba(0,0,0,.45)}
  .hero-text small{display:block;letter-spacing:.15em;text-transform:uppercase;font-size:.85rem;opacity:.9;margin-bottom:.6rem}
  .hero-text h1{margin:0 0 .5rem;font-size:clamp(2rem,5vw,3.6rem);line-height:1.1}
  .hero-text p{margin:0 0 1.5rem;font-size:clamp(1rem,2vw,1.3rem)}
  .btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;padding:.8rem 1.6rem;border-radius:6px;font-weight:600;text-shadow:none}
  .btn:hover{background:#185a3c}
  .pause{position:absolute;right:16px;bottom:16px;z-index:2;background:rgba(0,0,0,.45);color:#fff;border:0;border-radius:20px;padding:.45rem .9rem;cursor:pointer;font-size:.85rem}
  .collection{width:100%;height:100vh;border:0;display:block}
  @media (prefers-reduced-motion: reduce){.hero video{display:none}.hero{background:url(berkel-banner-poster.jpg) center/cover}}
</style>
</head>
<body>
  <header class="hero">
    <video autoplay muted loop playsinline poster="berkel-banner-poster.jpg" aria-hidden="true">
      <source src="berkel-banner.mp4" type="video/mp4">
    </video>
    <div class="hero-text">
      <small>Erasmus+ · Pictorius Berufskolleg &amp; EPI Lisboa</small>
      <h1>Projekt Blue Future</h1>
      <p>Wasser verbindet Lebensräume – Water Connects Living Environments</p>
      <a class="btn" href="#sammlung">Zur Sammlung</a>
    </div>
    <button class="pause" type="button" onclick="const v=document.querySelector('.hero video');if(v.paused){v.play();this.textContent='❚❚ Pause'}else{v.pause();this.textContent='▶ Abspielen'}">❚❚ Pause</button>
  </header>

  <main id="sammlung">
    <iframe class="collection"
      src="https://storymaps.arcgis.com/collections/c2958eb61ad0488783b5464ffc99a3ff?embed"
      title="Projekt Blue Future – Sammlung"
      allowfullscreen allow="geolocation"></iframe>
  </main>
</body>
</html>
